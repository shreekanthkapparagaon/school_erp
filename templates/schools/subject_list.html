{% extends "base.html" %}
{% block page_heading %}Subjects{% endblock %}
{% block content %}
<section class="card">
  <div class="table-header">
    <div>
      <p class="eyebrow">Latest first</p>
      <h2>Subjects</h2>
    </div>
    <div class="table-actions">
      <input data-filter="subjects" placeholder="Filter subjects">
      <a class="btn" href="{% url 'schools:create_subject' %}">Add Subject</a>
    </div>
  </div>
  <table data-table="subjects" data-page-size="12">
    <thead><tr><th data-sort>Name</th><th data-sort>Code</th><th data-sort>School</th></tr></thead>
    <tbody>
      {% for subject in subjects %}
        <tr><td>{{ subject.name }}</td><td>{{ subject.code }}</td><td>{{ subject.school.name }}</td></tr>
      {% empty %}
        <tr><td colspan="3">No subjects yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
  <div class="pager" data-pager="subjects"><button data-prev>Previous</button><span data-page></span><button data-next>Next</button></div>
</section>
{% endblock %}
