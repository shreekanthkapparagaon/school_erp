{% extends "base.html" %}
{% block page_heading %}{{ title }}{% endblock %}
{% block content %}
<div class="form-layout">
  <form class="card form-card" method="post">
    {% csrf_token %}
    <h2>{{ title }}</h2>
    {{ form.as_p }}
    <div class="form-actions">
      {% if cancel_url %}
        <a class="btn btn-muted" href="{{ cancel_url }}">Cancel</a>
      {% endif %}
      <button class="btn" type="submit">{{ submit_label|default:"Save" }}</button>
    </div>
  </form>
</div>
{% endblock %}
