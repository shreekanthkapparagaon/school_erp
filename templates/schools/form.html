{% extends "base.html" %}
{% block page_heading %}{{ title }}{% endblock %}
{% block content %}
<div class="form-layout">
  <form class="card form-card" method="post">
    {% csrf_token %}
    <h2>{{ title }}</h2>
    {{ form.as_p }}
    <button class="btn full" type="submit">{{ submit_label|default:"Save" }}</button>
  </form>
</div>
{% endblock %}
