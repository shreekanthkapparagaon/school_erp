{% extends "base.html" %}
{% block page_heading %}{{ title }}{% endblock %}
{% block content %}
<div class="form-layout">
  <form class="card form-card" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <h2>{{ title }}</h2>
    {{ form.as_p }}
    <div class="form-actions">
      <a class="btn btn-muted" href="{% url 'document:document_list' %}">Cancel</a>
      <button class="btn" type="submit">{{ submit_label }}</button>
    </div>
  </form>
</div>
{% endblock %}
