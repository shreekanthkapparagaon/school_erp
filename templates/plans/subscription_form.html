{% extends "base.html" %}

{% block page_heading %}{{ title }}{% endblock %}

{% block content %}
<div class="form-layout">
  <form class="card form-card" method="post">
    {% csrf_token %}
    <h2>{{ title }}</h2>
    {{ form.as_p }}
    <div class="form-actions">
      <a class="btn btn-muted" href="{% url 'plans:service_management' %}">Cancel</a>
      <button class="btn" type="submit">Save</button>
    </div>
  </form>
</div>
{% endblock %}
