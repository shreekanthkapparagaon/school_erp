<header class="topbar">

  <div class="topbar-left">

    <div>
      <p class="eyebrow">Academic Administration</p>
      <h1>{% block page_heading %}School ERP{% endblock %}</h1>
    </div>
  </div>

  <div class="top-actions">
    {% if user.is_authenticated %}
      <span class="user-pill">{{ user.get_role_display }}</span>

      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button class="btn btn-muted" type="submit">Logout</button>
      </form>
    {% else %}
      <a class="btn" href="{% url 'accounts:login' %}">Login</a>
    {% endif %}
  </div>

</header>
