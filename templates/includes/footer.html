<style>
  .footer {
    position: relative;
    margin-top: 48px;
    padding: 28px 34px;
    border-radius: 22px 22px 0 0;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow:
      0 -6px 30px rgba(15, 23, 42, 0.04),
      0 -1px 3px rgba(15, 23, 42, 0.03);
    overflow: hidden;
  }

  .footer::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(
      90deg,
      transparent,
      var(--primary),
      transparent
    );
    opacity: 0.8;
  }

  .footer-content {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 28px;
  }

  .footer-brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .footer-brand i {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    background: rgba(37, 99, 235, 0.1);
    color: var(--primary);
    font-size: 22px;
    transition: var(--transition);
  }

  .footer:hover .footer-brand i {
    transform: rotate(-8deg) scale(1.08);
  }

  .footer-brand strong {
    display: block;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 3px;
  }

  .footer-brand small {
    display: block;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  .footer-center {
    display: flex;
    justify-content: center;
  }

  .footer-status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid rgba(34, 197, 94, 0.15);
    color: #15803d;
    font-size: 13px;
    font-weight: 600;
  }

  .footer-status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 10px rgba(34, 197, 94, 0.45);
    animation: footerPulse 2s infinite;
  }

  .footer-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .footer-version {
    display: inline-flex;
    align-items: center;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(37, 99, 235, 0.08);
    border: 1px solid rgba(37, 99, 235, 0.15);
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
  }

  .footer-links {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid rgba(226, 232, 240, 0.65);
  }

  .footer-links a {
    position: relative;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    transition: var(--transition);
  }

  .footer-links a:hover {
    color: var(--primary);
  }

  .footer-links a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 0;
    height: 2px;
    background: var(--primary);
    transition: 0.25s;
  }

  .footer-links a:hover::after {
    width: 100%;
  }

  .footer-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid rgba(226, 232, 240, 0.65);
    font-size: 13px;
    color: var(--muted);
  }

  @keyframes footerPulse {
    0% {
      transform: scale(1);
      opacity: 1;
    }
    50% {
      transform: scale(1.25);
      opacity: 0.65;
    }
    100% {
      transform: scale(1);
      opacity: 1;
    }
  }

  @media (max-width: 992px) {
    .footer-content {
      grid-template-columns: 1fr;
      text-align: center;
    }

    .footer-brand {
      justify-content: center;
    }

    .footer-center,
    .footer-right {
      justify-content: center;
    }

    .footer-links {
      justify-content: center;
      flex-wrap: wrap;
    }

    .footer-bottom {
      flex-direction: column;
      gap: 10px;
      text-align: center;
    }
  }
</style>
