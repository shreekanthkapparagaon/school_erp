{% extends "base.html" %}
{% block page_heading %}Import Results{% endblock %}
{% block content %}
<div class="form-layout">
  <form class="card form-card" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="table-header">
      <div>
        <p class="eyebrow">{{ school_class.school.name }}</p>
        <h2>{{ school_class.name }} {{ school_class.section }}</h2>
      </div>
      <a class="btn btn-muted" href="{% url 'results:download_template' school_class.pk %}">Download Template</a>
    </div>
    {{ form.as_p }}
    <div class="form-actions">
      <a class="btn btn-muted" href="{% url 'results:class_results' school_class.pk %}">Cancel</a>
      <button class="btn" type="submit">Import Results</button>
    </div>
  </form>
</div>
{% endblock %}
